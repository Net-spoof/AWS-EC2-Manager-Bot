services:
  aws-manager:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - aws_manager_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
volumes:
  aws_manager_data:
